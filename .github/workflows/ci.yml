name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  xml:
    name: XML well-formedness and pack checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Well-formedness, IDs, rule map, dashboard
        run: python3 tests/test_xml_wellformed.py
