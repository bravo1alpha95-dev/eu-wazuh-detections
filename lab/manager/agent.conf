<!--
  Shared agent configuration for the EmpowerU Wazuh lab.
  The manager pushes this file to enrolled agents (default group).

  Frequency is 60 seconds so a scheduled scan is a useful backup to
  realtime (inotify). This is a lab setting. Do not copy this interval
  into production without review.
-->
<agent_config>
  <syscheck>
    <disabled>no</disabled>
    <frequency>60</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc</directories>
    <directories check_all="yes" realtime="yes">/usr/bin</directories>
  </syscheck>
</agent_config>
