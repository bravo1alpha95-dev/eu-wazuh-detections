<!--
  STARTER snippets for a Wazuh agent ossec.conf on a system you own.
  Copy only the blocks you need. Do not replace a working production
  configuration without a backup. These snippets are untested against a
  live manager.

  Manager address is a placeholder. Replace it with the manager you operate.
-->

<!-- Example: manager address (replace the placeholder). -->
<ossec_config>
  <client>
    <server>
      <address>REPLACE_WITH_MANAGER_IP_OR_HOSTNAME</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
  </client>
</ossec_config>

<!-- Example: file-integrity monitoring for paths the community collector
     also reviews. Tune frequency and ignore lists to your baseline. -->
<ossec_config>
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <directories check_all="yes" realtime="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>
    <directories check_all="yes" realtime="yes">/etc/ssh/sshd_config,/etc/sudoers,/etc/sudoers.d</directories>
  </syscheck>
</ossec_config>
